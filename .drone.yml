---
kind: pipeline
name: testing
type: docker

platform:
  os: linux
  arch: arm64

steps:
  - name: vet
    image: golang:1.22.4
    commands:
      - go vet ./...
    environment:

    volumes:
      - name: gopath
        path: /go

  - name: test
    image: golang:1.22.4
    commands:
      - go test -cover ./...
    environment:

    volumes:
      - name: gopath
        path: /go

volumes:
  - name: gopath
    temp: {}

---
kind: pipeline
name: linux-arm64-docker
type: docker

platform:
  os: linux
  arch: arm64

steps:
  - name: build-push
    image: golang:1.22.7
    commands:
      - 'go build -v -ldflags "-X main.version=${DRONE_COMMIT_SHA:0:8}" -a -tags netgo -o release/linux/arm64/drone-docker ./cmd/drone-docker'
    environment:
      CGO_ENABLED: 0
    when:
      event:
        exclude:
          - tag

  - name: build-tag
    image: golang:1.22.7
    commands:
      - 'go build -v -ldflags "-X main.version=${DRONE_TAG##v}" -a -tags netgo -o release/linux/arm64/drone-docker ./cmd/drone-docker'
    environment:
      CGO_ENABLED: 0
    when:
      event:
        - tag

  - name: executable
    image: golang:1.22.7
    commands:
      - ./release/linux/arm64/drone-docker --help

  - name: publish
    image: devanshmathur19/docker:linux-arm64
    settings:
      auto_tag: true
      auto_tag_suffix: linux-arm64-fromdrone
      daemon_off: false
      dockerfile: docker/docker/Dockerfile.linux.arm64
      password:
        from_secret: docker_password
      repo: devanshmathur19/docker
      username:
        from_secret: docker_username

depends_on:
  - testing
