---
kind: pipeline
name: testing
type: docker

platform:
  os: linux
  arch: amd64

steps:
  - name: vet
    image: golang:1.22.4
    commands:
      - go vet ./...
    environment:

    volumes:
      - name: gopath
        path: /go

  - name: test
    image: golang:1.22.4
    commands:
      - go test -cover ./...
    environment:

    volumes:
      - name: gopath
        path: /go

volumes:
  - name: gopath
    temp: {}

trigger:
  ref:
    - refs/heads/master
    - "refs/tags/**"
    - "refs/pull/**"
    branch:
    - CI-16402localdroente

---
kind: pipeline
name: linux-amd64-docker
type: docker

platform:
  os: linux
  arch: amd64

steps:
  - name: build-push
    image: golang:1.22.7
    commands:
      - 'go build -v -ldflags "-X main.version=${DRONE_COMMIT_SHA:0:8}" -a -tags netgo -o release/linux/amd64/drone-docker ./cmd/drone-docker'
    environment:
      CGO_ENABLED: 0
    when:
      event:
        exclude:
          - tag

  - name: build-tag
    image: golang:1.22.7
    commands:
      - 'go build -v -ldflags "-X main.version=${DRONE_TAG##v}" -a -tags netgo -o release/linux/amd64/drone-docker ./cmd/drone-docker'
    environment:
      CGO_ENABLED: 0
    when:
      event:
        - tag

  - name: executable
    image: golang:1.22.7
    commands:
      - ./release/linux/amd64/drone-docker --help

  - name: publish
    image: plugins/docker:18
    settings:
      auto_tag: true
      auto_tag_suffix: linux-amd64-fromdrone
      daemon_off: false
      dockerfile: docker/docker/Dockerfile.linux.amd64
      password:
        from_secret: docker_password
      repo: devanshmathur19/docker
      username:
        from_secret: docker_username
    when:
      event:
        exclude:
          - pull_request

trigger:
  ref:
    - refs/heads/master
    - "refs/tags/**"
    - "refs/pull/**"
  branch:
    - CI-16402localdroentest

depends_on:
  - testing
